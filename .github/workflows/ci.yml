name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, analyse statique pour Linux, Windows et macOS, tests avec détection de
  # concurrence, puis binaire Windows conservé comme artefact.
  linux:
    name: Linux · format, vet, tests, build Windows et deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        shell: bash
        run: |
          if [ ! -f go.sum ]; then
            echo "::warning title=go.sum absent::go.sum n'est pas commité ; il est généré pour ce build (modules vérifiés contre sum.golang.org). Lancer 'go mod tidy' et commiter go.sum."
            go mod tidy
            # Contenu généré, affiché en annotation pour pouvoir le commiter tel quel.
            echo "::notice title=go.sum généré::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' go.sum)"
          else
            # go.mod et go.sum doivent être à jour : affiche l'écart (aussi en annotation,
            # lisible sans le journal brut) et échoue sinon.
            if ! go mod tidy -diff > tidy.diff 2>&1; then
              cat tidy.diff
              echo "::error title=go mod tidy::$(grep -v '^go: downloading' tidy.diff | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
              exit 1
            fi
          fi
          go mod verify

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error title=gofmt::fichiers à formater avec gofmt -w :"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet (Linux)
        run: go vet ./...

      # Vulnérabilités connues (bibliothèque standard du compilateur utilisé, dépendances) :
      # la CI échoue si le code appelle une fonction touchée.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Vet (Windows)
        run: GOOS=windows GOARCH=amd64 go vet ./...

      # Linux et macOS : fonctions système pas encore écrites (internal/platform), mais
      # le code commun et les réponses « non pris en charge » doivent compiler.
      - name: Vet et build (macOS, Linux)
        run: |
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/kura-agent
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/kura-agent

      - name: Tests
        run: go test -race -count=1 ./...

      - name: Build Windows
        run: |
          VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%d)" \
            -o dist/kura-agent.exe ./cmd/kura-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%d)" \
            -o dist/kura-agentw.exe ./cmd/kura-agent

      # Paquet Debian (Ubuntu) : construit, installé sur le runner, mis en place
      # (compte, timer) puis purgé ; artefact téléchargeable pour les essais.
      - name: Build Linux et paquet deb
        run: |
          VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA::7} -X main.date=$(date -u +%Y-%m-%d)" \
            -o dist/linux/kura-agent ./cmd/kura-agent
          sh scripts/build-deb.sh "$VERSION" amd64 dist/linux/kura-agent dist/linux
          dpkg-deb --info dist/linux/kura-agent_*_amd64.deb
          dpkg-deb --contents dist/linux/kura-agent_*_amd64.deb

      - name: Paquet deb de bout en bout
        run: |
          set -x
          sudo dpkg -i dist/linux/kura-agent_*_amd64.deb
          id kura-agent
          test "$(command -v kura-agent)" = /usr/bin/kura-agent
          mkdir -p "$RUNNER_TEMP/source" && echo essai > "$RUNNER_TEMP/source/a.txt"
          cat > "$RUNNER_TEMP/kura.yaml" <<EOF
          version: 1
          profile:
            name: ci
            endpoint: https://s3.eu-central-1.wasabisys.com
            region: eu-central-1
            bucket: acme-ci
          schedule:
            type: daily
            time: "22:30"
            run_if_missed: true
          jobs:
            - id: data
              source: $RUNNER_TEMP/source
              destination: DATA
          EOF
          sudo kura-agent install --config "$RUNNER_TEMP/kura.yaml" --skip-validate
          systemctl list-timers --all kura-sync.timer | grep kura-sync.timer
          systemctl cat kura-sync.service | grep -x 'ExecStart=/usr/bin/kura-agent run --scheduled'
          systemctl is-enabled kura-sync.timer
          test -f /etc/kura/config.yaml
          sudo dpkg --purge kura-agent
          test ! -e /etc/systemd/system/kura-sync.timer
          test ! -e /etc/kura && test ! -e /var/lib/kura
          test ! -e /usr/bin/kura-agent

      - uses: actions/upload-artifact@v7
        with:
          name: kura-agent-linux-amd64-${{ github.sha }}
          path: |
            dist/linux/kura-agent
            dist/linux/kura-agent_*_amd64.deb
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: kura-agent-windows-amd64-${{ github.sha }}
          path: |
            dist/kura-agent.exe
            dist/kura-agentw.exe
          retention-days: 14

  # Les tests qui touchent au système (verrou, chemins, renommage de fichiers)
  # passent aussi sur un vrai Windows.
  windows:
    name: Windows · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        shell: bash
        run: go mod download && go mod verify

      # Les échecs remontent en annotations : lisibles sans télécharger le journal.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test.log | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Lancement du binaire
        shell: bash
        run: |
          go build -o kura-agent.exe ./cmd/kura-agent
          ./kura-agent.exe version
          ./kura-agent.exe help

  # Préparations db_export contre de vraies bases (services) avec les vrais outils :
  # PostgreSQL 16 et MySQL 8.0 (clients du runner), puis MariaDB 10.11 avec mariadb-dump.
  # Chaque export est rechargé et comparé.
  bases-linux:
    name: Linux · exports de bases et chiffrement
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kura-ci-pg
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: kura-ci-my
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -pkura-ci-my" --health-interval 5s --health-retries 30
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: kura-ci-my
        ports: ["3307:3306"]
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-retries 30
    env:
      KURA_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        run: go mod download

      - name: PostgreSQL et MySQL
        env:
          KURA_TEST_PG_DUMP: /usr/lib/postgresql/16/bin/pg_dump
          KURA_TEST_PG_HOST: 127.0.0.1
          KURA_TEST_PG_PORT: "5432"
          KURA_TEST_PG_PASSWORD: kura-ci-pg
          KURA_TEST_MYSQLDUMP: /usr/bin/mysqldump
          KURA_TEST_MYSQL_TARGETS: 127.0.0.1:3306
          KURA_TEST_MYSQL_ROOT_PASSWORD: kura-ci-my
        run: |
          # Échec : la fin de la sortie en une annotation (lisible sans le journal brut).
          annotate() { tail -n 150 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=go test::/'; }
          ls -l "$KURA_TEST_PG_DUMP" "$KURA_TEST_MYSQLDUMP" || true
          set -o pipefail
          go test -count=1 -v -run 'TestPostgresRealExport|TestMySQLRealExport' ./internal/prepare/ 2>&1 | tee test.log || { annotate test.log; exit 1; }

      # Chiffrement : GnuPG du runner, outil age officiel (déchiffre ce que l'agent chiffre).
      - name: Chiffrement (gpg, age)
        env:
          KURA_TEST_GPG: /usr/bin/gpg
          KURA_TEST_AGE: /usr/bin/age
        run: |
          # Échec : la fin de la sortie en une annotation (lisible sans le journal brut).
          annotate() { tail -n 150 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=go test::/'; }
          sudo apt-get install -y -q age
          gpg --version | head -1 && age --version
          set -o pipefail
          go test -count=1 -v -run 'TestGPGRealEncrypt|TestAgeRealDecrypt' ./internal/prepare/ 2>&1 | tee test.log || { annotate test.log; exit 1; }

      # mariadb-dump hors des paquets MySQL du runner (qui l'excluent) : client MariaDB
      # extrait dans /usr/lib/kura-mariadb, dossier de root (/opt du runner est ouvert à
      # tous : l'agent y refuserait l'outil, à juste titre) ; sa bibliothèque libmariadb3
      # s'installe à côté de MySQL sans conflit.
      - name: Client MariaDB
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libmariadb3
          cd "$RUNNER_TEMP"
          apt-get download mariadb-client mariadb-client-core
          for d in mariadb-client*.deb; do sudo dpkg-deb -x "$d" /usr/lib/kura-mariadb; done
          sudo setfacl -Rb /usr/lib/kura-mariadb
          ls -l /usr/lib/kura-mariadb/usr/bin/ | grep -E 'mariadb|mysql'
          /usr/lib/kura-mariadb/usr/bin/mariadb-dump --version

      - name: MariaDB
        env:
          KURA_TEST_MYSQLDUMP: /usr/lib/kura-mariadb/usr/bin/mariadb-dump
          KURA_TEST_MYSQL_TARGETS: 127.0.0.1:3307
          KURA_TEST_MYSQL_ROOT_PASSWORD: kura-ci-my
        run: |
          # Échec : la fin de la sortie en une annotation (lisible sans le journal brut).
          annotate() { tail -n 150 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=go test::/'; }
          set -o pipefail
          go test -count=1 -v -run 'TestMySQLRealExport' ./internal/prepare/ 2>&1 | tee test.log || { annotate test.log; exit 1; }

  # Export SQL Server : SQL Server 2022 Express (instance SQLEXPRESS) installé sur le
  # runner, sqlcmd ODBC fourni avec ; droit d'écriture du compte du service accordé puis
  # retiré, propriété des sauvegardes reprise.
  bases-windows:
    name: Windows · export SQL Server
    runs-on: windows-latest
    env:
      KURA_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        shell: bash
        run: go mod download

      - name: SQL Server Express
        shell: pwsh
        run: |
          choco install sql-server-express -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Service 'MSSQL$SQLEXPRESS'
          $sqlcmd = Get-ChildItem 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\*\Tools\Binn\SQLCMD.EXE' |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sqlcmd) { Write-Error "sqlcmd ODBC introuvable"; exit 1 }
          & $sqlcmd -S 'localhost\SQLEXPRESS' -E -b -C -Q "SELECT @@VERSION"
          "KURA_TEST_SQLCMD=$sqlcmd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Export SQL Server
        shell: bash
        env:
          KURA_TEST_SQL_INSTANCE: localhost\SQLEXPRESS
        run: |
          # Échec : la fin de la sortie en une annotation (lisible sans le journal brut).
          annotate() { tail -n 150 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | sed 's/^/::error title=go test::/'; }
          set -o pipefail
          go test -count=1 -v -run 'TestSQLServerRealExport|TestMSServiceName' ./internal/prepare/ 2>&1 | tee test.log || { annotate test.log; exit 1; }

  # macOS (Apple silicon) : tests sur un vrai macOS, plists relues par plutil.
  macos:
    name: macOS · tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        run: go mod download

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test.log | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Lancement du binaire
        run: |
          go build -o kura-agent ./cmd/kura-agent
          ./kura-agent version
          ./kura-agent help

  # macOS Intel : runner auto-hébergé (étiquette osx-intel). Dépôt public : jamais
  # pour une PR venue d'un fork (les PR externes demandent en plus une approbation
  # dans les réglages du dépôt, un workflow modifié ne passant pas ce test).
  macos-intel:
    name: macOS Intel · tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, osx-intel]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: Modules
        run: go mod download

      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          test "$(go env GOARCH)" = amd64 || { echo "::error::runner osx-intel en $(go env GOARCH)"; exit 1; }
          go test -race -count=1 ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test.log | head -20 |
              while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Lancement du binaire
        run: |
          go build -o kura-agent ./cmd/kura-agent
          ./kura-agent version
          ./kura-agent help
